<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Dragons El Puig — Calendario unificado</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Big+Shoulders+Display:wght=600;700;800;900&family=Manrope:wght=400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #0E0D0C; --bg-alt: #161514; --card: #1B1918; --ink: #F5F3EF;
        --ink-dim: #928D86; --ember: #C8202C; --silver: #E2E0DB; --line: #2A2826;
        --win: #4FBF6E; --loss: #E14B4B; --draw: #D9A536;
        --black-team: #0E0D0C; --white-team: #F5F3EF;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Manrope', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
      .display { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; letter-spacing: 0.01em; line-height: 0.86; }
      .wrap { max-width: 900px; margin: 0 auto; padding: 0 20px; }
      a { text-decoration: none; color: inherit; }

      /* HERO */
      header.hero { position: relative; padding: 56px 0 34px; border-bottom: 1px solid var(--line); overflow: hidden; }
      .hero-flame { position: absolute; top: -30%; right: -14%; width: 55%; height: 160%; background: radial-gradient(circle at 60% 40%, rgba(200,32,44,0.16), transparent 65%); pointer-events: none; }
      .brand-row { display: flex; align-items: center; gap: 22px; }
      .badge { width: clamp(64px, 12vw, 92px); height: clamp(64px, 12vw, 92px); border-radius: 50%; flex: none; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0,0,0,0.5); object-fit: cover; }
      h1.club-name { font-size: clamp(2.5rem, 9vw, 5.2rem); margin: 0; }
      h1.club-name .accent { color: var(--ember); }
      .hero-sub { color: var(--ink-dim); font-size: 1.02rem; margin: 16px 0 0; }

      /* NEXT MATCH */
      .next-match { margin-top: 32px; background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--ember); border-radius: 3px; padding: 20px 24px; }
      .nm-header { display: flex; align-items: center; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
      .nm-header .label { font-size: 0.8rem; color: var(--ink-dim); text-transform: uppercase; letter-spacing: 0.05em; }
      .nm-list { display: flex; flex-direction: column; }
      .nm-item { padding-top: 14px; margin-top: 14px; border-top: 1px solid var(--line); }
      .nm-item .tag-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
      .nm-item .cat-label { font-size: 0.78rem; color: var(--ink-dim); }
      .nm-item .matchup { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.6rem; }
      .nm-item .matchup .dragons { color: var(--ember); }
      .nm-item .matchup .vs { color: var(--ink-dim); font-size: 0.92rem; padding: 0 8px; font-family: 'Manrope', sans-serif; }
      .nm-item .meta { color: var(--ink-dim); font-size: 0.86rem; margin-top: 4px; }
      
      .countdown { display: flex; gap: 12px; }
      .countdown .unit { text-align: center; min-width: 44px; }
      .countdown .num { font-family: 'Big Shoulders Display', sans-serif; font-size: 1.7rem; font-weight: 800; color: var(--ember); line-height: 1; }
      .countdown .u-label { font-size: 0.64rem; color: var(--ink-dim); margin-top: 2px; }

      /* STATUS TABS */
      .status-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--line); margin: 32px 0 12px; }
      .tab-btn { background: transparent; border: none; color: var(--ink-dim); font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.35rem; letter-spacing: 0.05em; padding: 8px 4px 12px; cursor: pointer; position: relative; transition: color 0.15s; }
      .tab-btn:hover { color: var(--ink); }
      .tab-btn.active { color: var(--ember); }
      .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; background: var(--ember); }

      /* CHIPS */
      .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 24px; }
      .chip { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line); color: var(--ink-dim); padding: 8px 14px; border-radius: 100px; font-size: 0.86rem; font-weight: 600; cursor: pointer; user-select: none; transition: all .15s; }
      .chip.active { background: var(--ember); border-color: var(--ember); color: #FFFFFF; }
      .chip:not(.active):hover { border-color: var(--silver); color: var(--ink); }

      /* FIXTURES */
      main { padding: 12px 0 8px; }
      .month-heading { font-family: 'Big Shoulders Display', sans-serif; font-weight: 700; font-size: 1.35rem; color: var(--silver); margin: 30px 0 12px; text-transform: uppercase; letter-spacing: 0.05em; }
      .fixture { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 16px; padding: 15px 0; border-top: 1px solid var(--line); }
      .fixture .date { text-align: center; }
      .fixture .date .day { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.7rem; color: var(--ink); display: block; line-height: 1; }
      .fixture .date .wd { font-size: 0.68rem; color: var(--ink-dim); text-transform: uppercase; }
      
      .fixture .info .tags { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; flex-wrap: wrap; }
      .team-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
      .team-dot.negro { background: var(--black-team); border: 1px solid var(--silver); }
      .team-dot.blanco { background: var(--white-team); border: 1px solid var(--ember); }
      .cat-tag { font-size: 0.72rem; color: var(--ink-dim); font-weight: 700; }
      .jor-tag { font-size: 0.72rem; color: var(--ink-dim); }
      .jor-tag::before { content: '· '; }
      
      .fixture .teams { font-weight: 700; font-size: 1.05rem; }
      .fixture .teams .dragons { color: var(--ember); }
      .fixture .teams .vs { color: var(--ink-dim); font-weight: 500; padding: 0 6px; }
      .fixture .venue { color: var(--ink-dim); font-size: 0.82rem; margin-top: 4px; }
      .fixture .venue .hora { color: var(--ink); font-weight: 600; }
      
      .fixture .right-col { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
      .result-badge { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 1.4rem; letter-spacing: 0.05em; }
      .result-badge.win { color: var(--win); }
      .result-badge.loss { color: var(--loss); }
      .result-badge.draw { color: var(--draw); }
      .result-badge.pending { font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 0.78rem; color: var(--ink-dim); }
      
      .map-link { display: inline-flex; align-items: center; gap: 5px; font-size: 0.76rem; color: var(--silver); border: 1px solid var(--line); padding: 5px 12px; border-radius: 100px; }
      .map-link:hover { border-color: var(--silver); background: var(--bg-alt); }
      .empty-state { color: var(--ink-dim); padding: 40px 0; font-size: 0.95rem; text-align: center; }

      footer { padding: 40px 0; color: var(--ink-dim); font-size: 0.82rem; border-top: 1px solid var(--line); margin-top: 40px; }

      @media (max-width: 560px) {
        .fixture { grid-template-columns: 44px 1fr; gap: 12px; }
        .fixture .right-col { grid-column: 2; align-items: flex-start; flex-direction: row; justify-content: space-between; margin-top: 4px; }
      }
    </style>
</head>
<body>

    <header class="hero">
        <div class="hero-flame"></div>
        <div class="wrap">
            <div class="brand-row">
                <img src="logo.png" alt="Logo Dragons El Puig" class="badge">
                <h1 class="club-name display">DRAGONS <span class="accent">EL PUIG</span></h1>
            </div>
            <p class="hero-sub">Calendario unificado y centro de resultados oficial de todas nuestras categorías.</p>
        </div>
    </header>

    <div class="wrap">
        <!-- PRÓXIMO PARTIDO -->
        <section id="next-match-section" class="next-match" style="display: none;">
            <div class="nm-header">
                <span class="label">Próximo choque de la jornada</span>
                <div id="countdown-container" class="countdown"></div>
            </div>
            <div id="nm-list-container" class="nm-list"></div>
        </section>

        <!-- PESTAÑAS JUGADOS/PENDIENTES -->
        <section class="status-tabs" id="status-tabs">
            <button class="tab-btn active" data-status="proximos">PRÓXIMOS PARTIDOS</button>
            <button class="tab-btn" data-status="resultados">RESULTADOS ANTERIORES</button>
        </section>

        <!-- FILTROS ACTUALIZADOS CON COLOR DE EQUIPO -->
        <section class="filters" id="category-filters">
            <div class="chip active" data-category="todos">Todos los equipos</div>
            <div class="chip" data-category="PreBenjamín">PreBenjamín</div>
            <div class="chip" data-category="Benjamín Negro">Benjamín Negro</div>
            <div class="chip" data-category="Benjamín Blanco">Benjamín Blanco</div>
            <div class="chip" data-category="Alevín Negro">Alevín Negro</div>
            <div class="chip" data-category="Alevín Blanco">Alevín Blanco</div>
            <div class="chip" data-category="Infantil">Infantil</div>
            <div class="chip" data-category="Juvenil">Juvenil</div>
        </section>

        <!-- LISTADO -->
        <main id="matches-list">
            <div class="empty-state">Sincronizando con Google Sheets...</div>
        </main>

        <footer>
            <div class="wrap">
